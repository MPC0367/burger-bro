<!-- A direct address for the arcade (a shared link, a refresh). It opens the game at once;
     leaving it goes back to the restaurant page, keeping the chosen language. -->

<script type="module">
  const q = new URLSearchParams(location.search);
  let lang = q.get("lang");
  if (lang !== "en" && lang !== "th") { try { lang = localStorage.getItem("bb-lang"); } catch {} }
  lang = lang === "th" ? "th" : "en";
  document.documentElement.lang = lang;
  document.body.dataset.lang = lang;
  // Leaving goes back where the visitor came from (the restaurant page on GitHub Pages, at
  // the same scroll position); opened directly, it goes to this copy's home page.
  document.addEventListener("bb:arcade-close", () => {
    if (document.referrer && history.length > 1) history.back();
    else {
      const home = document.querySelector('meta[name="bb-home"]'); // on play.burgerbrobangkok.com: the restaurant's site
      location.href = (home ? home.content : "../") + (lang === "th" ? "?lang=th" : "");
    }
  });
  import("./arcade.js").then((m) => m.openArcade({ returnFocus: null }));
</script>
