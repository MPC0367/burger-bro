<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Block Party · Burger Bro</title>
<link rel="icon" href="../media/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kanit:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F5EEDF; color: #221511; font: 16px/1.5 "Libre Franklin", Kanit, system-ui, sans-serif; }
  .fallback { max-width: 560px; margin: 15vh auto; padding: 0 16px; }
  .fallback a { color: #C42B1C; font-weight: 700; }
</style>
</head>
<body>
<!-- A direct address for the arcade (a shared link, a refresh). It opens the game at once;
     leaving it goes back to the restaurant page, keeping the chosen language. -->
<div class="fallback"><p><a href="../">← Burger Bro</a></p><noscript><p>The arcade needs JavaScript. Ordering works on the main page.</p></noscript></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  let lang = q.get("lang");
  if (lang !== "en" && lang !== "th") { try { lang = localStorage.getItem("bb-lang"); } catch {} }
  lang = lang === "th" ? "th" : "en";
  document.documentElement.lang = lang;
  document.body.dataset.lang = lang;
  document.addEventListener("bb:arcade-close", () => { location.href = "../" + (lang === "th" ? "?lang=th" : ""); });
  import("./arcade.js").then((m) => m.openArcade({ returnFocus: null }));
</script>
</body>
</html>
